<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BODEGA - ONLINE</title>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;padding:10px}
.top{background:#0f172a;color:#fff;padding:14px;border-radius:12px;position:sticky;top:0;z-index:10}
.top h1{margin:0;font-size:20px} .top p{margin:4px 0 0;font-size:12px;opacity:.8}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:8px}
.admin{background:#22c55e;color:#fff} .viewer{background:#f59e0b;color:#fff} .offline{background:#ef4444;color:#fff}
.search{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{padding:10px 14px;border:0;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px}
.blue{background:#2563eb;color:#fff} .green{background:#16a34a;color:#fff} .orange{background:#f97316;color:#fff} .red{background:#dc2626;color:#fff} .gray{background:#e2e8f0}
.card{background:#fff;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card b{font-size:15px} .small{font-size:12px;color:#64748b}
.qty{font-size:20px;font-weight:bold;text-align:center;min-width:60px}
.row{display:flex;gap:6px;align-items:center}
.row button{padding:8px 12px}
input,select{padding:10px;border:1px solid #ddd;border-radius:10px;width:100%;margin-bottom:8px;font-size:15px}
#addBox{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px;display:none}
#status{font-size:12px;text-align:center;margin:6px 0;color:#475569}
</style>
</head>
<body>
<div class="top">
<h1>📦 BODEGA - ONLINE</h1>
<p>TOTAL ITEMS: <span id="total">0</span> | TOTAL QTY: <span id="totalQty">0</span></p>
<span id="modeBadge" class="badge admin">ADMIN - IKAW</span>
<span id="cloudBadge" class="badge offline">● CONNECTING...</span>
<div id="status">Naghihintay sa cloud...</div>
</div>

<input id="search" class="search" placeholder="🔍 Search code / name... / Scan barcode dito..." oninput="render()">

<div class="btns" id="adminBtns">
<button class="green" onclick="toggleAdd()">+ ADD ITEM</button>
<button class="blue" onclick="document.getElementById('file').click()">📥 IMPORT BACKUP (333 mo)</button>
<button class="orange" onclick="exportBackup()">💾 BACKUP</button>
<button class="blue" onclick="uploadToCloud()">☁️ I-UPLOAD SA CLOUD NGAYON</button>
</div>
<div class="btns" id="viewerBtns" style="display:none">
<button class="gray" onclick="location.reload()">🔄 REFRESH - Tingnan kung may bago</button>
</div>

<div id="addBox">
<h3 style="margin:0 0 8px">Bagong Item</h3>
<input id="nCode" placeholder="Code / Barcode (ex: 480001...)">
<input id="nName" placeholder="Name (ex: Nescafe 20g)">
<input id="nQty" type="number" placeholder="Qty" value="1">
<input id="nLoc" placeholder="Location (ex: A1)">
<button class="green" onclick="addItem()">SAVE</button>
<button class="gray" onclick="toggleAdd()">CANCEL</button>
</div>

<div id="list"></div>
<input type="file" id="file" accept=".json" style="display:none" onchange="importFile(event)">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBlbz1NoENQS1W2FNBt7EK6Mh9eGXShSbs",
authDomain: "inventory-2e071.firebaseapp.com",
projectId: "inventory-2e071",
storageBucket: "inventory-2e071.firebasestorage.app",
messagingSenderId: "1015750410521",
appId: "1:1015750410521:web:30312963f5267005088588"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "inventory", "main");

const params = new URLSearchParams(location.search);
const isViewer = params.get("mode") === "view";
window.isViewer = isViewer;

let items = JSON.parse(localStorage.getItem("bodega_items") || "[]");
if(items.length===0){
items = [
{code:"SAMPLE1", name:"Sample - Nescafe", qty:10, loc:"A1"},
{code:"SAMPLE2", name:"Sample - Milo", qty:5, loc:"A2"},
{code:"SAMPLE3", name:"Sample - Kopiko", qty:8, loc:"A3"},
];
}

if(isViewer){
document.getElementById("modeBadge").textContent = "👁️ VIEWER - SI SIR (Bawal mag-edit)";
document.getElementById("modeBadge").className = "badge viewer";
document.getElementById("adminBtns").style.display = "none";
document.getElementById("viewerBtns").style.display = "flex";
} else {
document.getElementById("modeBadge").textContent = "🔧 ADMIN - IKAW (Pwede mag-edit)";
}

async function saveLocal(){ localStorage.setItem("bodega_items", JSON.stringify(items)); }
async function uploadToCloud(){
if(isViewer) return alert("Viewer ka lang, hindi ka pwede mag-upload");
document.getElementById("status").textContent = "☁️ Nag-u-upload sa cloud...";
try{
await setDoc(docRef, {items: items, updatedAt: Date.now(), updatedBy: "admin"});
document.getElementById("status").textContent = "✅ Na-upload na sa cloud! Makikita na ni Sir!";
}catch(e){ alert("Error upload: "+e.message); }
}
window.uploadToCloud = uploadToCloud;

// REALTIME - pag nagbago sa cloud, auto-bago din dito
onSnapshot(docRef, (snap)=>{
document.getElementById("cloudBadge").textContent = "● ONLINE - NAKA-CONNECT SA CLOUD";
document.getElementById("cloudBadge").className = "badge admin";
if(snap.exists()){
const data = snap.data();
// Kung mas bago yung sa cloud, gamitin yun
if(data.items && JSON.stringify(data.items) !== JSON.stringify(items)){
items = data.items;
saveLocal();
document.getElementById("status").textContent = "☁️ Bagong update galing sa cloud! " + new Date(data.updatedAt).toLocaleString();
}
render();
} else {
document.getElementById("status").textContent = "Walang laman pa sa cloud. Pindot mo 'I-UPLOAD SA CLOUD NGAYON'";
render();
}
}, (err)=>{
document.getElementById("cloudBadge").textContent = "● OFFLINE - Local lang";
document.getElementById("cloudBadge").className = "badge offline";
render();
});

window.render = function(){
const q = document.getElementById("search").value.toLowerCase();
const list = document.getElementById("list");
document.getElementById("total").textContent = items.length;
document.getElementById("totalQty").textContent = items.reduce((a,i)=>a+Number(i.qty||0),0);
const filtered = items.filter(i => (i.code+i.name+(i.loc||"")).toLowerCase().includes(q));
list.innerHTML = filtered.map((it, idx)=>{
const realIdx = items.indexOf(it);
if(isViewer){
return `<div class="card"><div><b>${it.name}</b><div class="small">${it.code} | Loc: ${it.loc||"-"}</div></div><div class="qty">${it.qty}</div></div>`;
}
return `<div class="card"><div><b>${it.name}</b><div class="small">${it.code} | Loc: ${it.loc||"-"}</div></div><div class="row"><button class="red" onclick="changeQty(${realIdx},-1)">- OUT</button><div class="qty">${it.qty}</div><button class="green" onclick="changeQty(${realIdx},1)">+ IN</button><button class="gray" onclick="delItem(${realIdx})">🗑️</button></div></div>`;
}).join("") || "<p style='text-align:center;color:#888'>Walang item. Import mo yung 333 mo.</p>";
};

window.changeQty = async function(i, d){
items[i].qty = Math.max(0, Number(items[i].qty||0)+d);
saveLocal(); render();
await uploadToCloud();
};
window.delItem = async function(i){
if(!confirm("Delete "+items[i].name+"?")) return;
items.splice(i,1); saveLocal(); render(); await uploadToCloud();
};
window.toggleAdd = function(){
const b = document.getElementById("addBox");
b.style.display = b.style.display==="block" ? "none" : "block";
};
window.addItem = async function(){
const code = document.getElementById("nCode").value.trim();
const name = document.getElementById("nName").value.trim();
const qty = Number(document.getElementById("nQty").value||1);
const loc = document.getElementById("nLoc").value.trim();
if(!code || !name) return alert("Lagyan mo ng Code at Name");
const ex = items.findIndex(x=>x.code===code);
if(ex>=0){ items[ex].qty += qty; } else { items.push({code,name,qty,loc}); }
saveLocal(); render(); toggleAdd(); await uploadToCloud();
document.getElementById("nCode").value=""; document.getElementById("nName").value="";
document.getElementById("search").value = code; render();
// Auto-focus sa search para tuloy-tuloy scan
document.getElementById("search").focus();
};
window.exportBackup = function(){
const blob = new Blob([JSON.stringify({items},null,2)], {type:"application/json"});
const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "BACKUP_INVENTORY_"+Date.now()+".json"; a.click();
};
window.importFile = function(e){
const f = e.target.files[0]; if(!f) return;
const r = new FileReader();
r.onload = async ()=>{
try{
const j = JSON.parse(r.result);
const arr = j.items || j;
if(!Array.isArray(arr)) return alert("Hindi valid backup");
if(confirm("Nakita "+arr.length+" items. OK = DAGDAG sa ngayon")){
arr.forEach(n=>{
const ex = items.findIndex(x=>x.code===n.code);
if(ex>=0) items[ex].qty = Number(n.qty||0);
else items.push(n);
});
// Tanggalin sample pag may tunay na
items = items.filter(x=>!x.code.startsWith("SAMPLE") || items.length<=3);
saveLocal(); render(); await uploadToCloud();
alert("Na-import na! Total: "+items.length+" - Na-upload na din sa cloud!");
}
}catch(err){ alert("Error: "+err.message); }
};
r.readAsText(f);
};
// Enter sa search = scan +IN agad
document.getElementById("search").addEventListener("keydown", async (e)=>{
if(e.key==="Enter" && !isViewer){
const code = e.target.value.trim();
if(!code) return;
const idx = items.findIndex(x=>x.code===code);
if(idx>=0){ await changeQty(idx,1); e.target.value=""; render(); }
else { document.getElementById("nCode").value=code; toggleAdd(); document.getElementById("nName").focus(); }
}
});
render();
</script>
</body>
</html>
